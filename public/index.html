<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Relikvie Aréna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Saira+Condensed:wght@300;600;800&display=swap">
<style>
/* Layout: full-bleed 3D arena, HUD pinned to the safe-area corners; hub and menus are scrims over a live bot match. */
:root{
  --bg:#04060c; --ink:#e8eeff; --muted:#8a95b6; --panel:rgba(8,12,24,.86); --panel2:rgba(14,20,38,.9); --line:rgba(130,160,255,.2);
  --blue:#3fb8ff; --red:#ff3f8e; --gold:#ffc66d; --amber:#ffb347; --green:#5dffa8; --cyan:#6acbff;
  --r0:#a9b3c9; --r1:#5dffa8; --r2:#4fb4ff; --r3:#c08bff; --r4:#ffc66d;
  --display:'Saira Condensed','Arial Narrow',sans-serif; --body:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(env(safe-area-inset-top,0px) + 12px); --gb:calc(env(safe-area-inset-bottom,0px) + 14px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{user-select:none;-webkit-user-select:none;touch-action:none;font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#bars,#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 40%,rgba(255,40,80,.55));opacity:0;transition:opacity .25s}

.ub{position:absolute;left:0;top:0;width:76px;display:grid;gap:2px;justify-items:center;will-change:transform}
.ub .n{font-size:11px;letter-spacing:.06em;color:var(--ink);text-shadow:0 1px 2px #000;white-space:nowrap}
.ub.mine .n{color:var(--gold)}
.ub.human .n::before{content:"◆ ";color:var(--gold);font-size:8px}
.ub.npc .n{display:none}
.ub .hb{position:relative;width:64px;height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.ub.npc .hb{width:44px;height:4px}
.ub .hb i{position:absolute;left:0;top:0;bottom:0}
.ub.t0 .h{background:var(--blue)} .ub.t1 .h{background:var(--red)}
.ub .s{background:rgba(255,255,255,.75)}
.ub em{font-style:normal;font-size:9px;letter-spacing:.12em;color:var(--gold);min-height:11px}
.fl{position:absolute;left:0;top:0;font-family:var(--display);font-weight:800;font-size:15px;text-shadow:0 0 6px rgba(0,0,0,.9);white-space:nowrap}
.fl.out{color:#fff;font-size:19px}.fl.in{color:#ff6a7f}.fl.dmg{color:#b9c3e0;font-size:13px}.fl.dot{color:#c98bff;font-size:12px}
.fl.heal{color:var(--green);font-size:14px}.fl.info{color:var(--gold);font-size:14px;letter-spacing:.08em}
.fl.loot{font-size:16px;letter-spacing:.04em}

#hud .top{position:fixed;top:var(--gt);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  background:var(--panel);border:1px solid var(--line);padding:6px 16px;border-radius:3px;font-family:var(--display)}
.score b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:1.4ch;text-align:center}
.score .t0{color:var(--blue)} .score .t1{color:var(--red)}
.score>span{font-size:13px;letter-spacing:.2em;font-weight:600}
.score .mid{display:grid;justify-items:center;line-height:1.1;color:var(--muted)}
.score .mid small{font-size:12px;letter-spacing:.14em}
.score .mid #clock{font-size:18px;color:var(--ink);letter-spacing:.05em;font-variant-numeric:tabular-nums}
#modeBar{position:fixed;top:calc(var(--gt) + 64px);left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;width:min(520px,70vw)}
.pts{display:flex;gap:8px}
.pt{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;border:2px solid var(--line);background:var(--panel)}
.pt.o0{border-color:var(--blue);color:var(--blue)} .pt.o1{border-color:var(--red);color:var(--red)}
.bossbar{width:100%;display:grid;gap:3px}
.bossbar .bn{display:flex;justify-content:space-between;font-family:var(--display);font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.bossbar .bn small{font-family:var(--body);font-size:11px;color:var(--gold);letter-spacing:.06em;text-transform:none}
.bossbar .bb{position:relative;height:12px;background:rgba(0,0,0,.6);border:1px solid rgba(255,82,126,.5);border-radius:2px;overflow:hidden}
.bossbar .bb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#b0213f,#ff527e);transition:width .15s}
.bossbar .bb u{position:absolute;left:0;top:0;bottom:0;background:rgba(240,248,255,.65);text-decoration:none}
.modeinfo{font-size:12px;letter-spacing:.08em;color:var(--gold);background:var(--panel);border:1px solid var(--line);padding:3px 10px;border-radius:2px}
#hud .tl{position:fixed;top:var(--gt);left:var(--gl);display:grid;gap:6px;width:150px}
#mini{width:150px;height:150px;border-radius:50%;background:rgba(6,9,18,.75);border:1px solid var(--line)}
#relicInfo{font-size:12px;color:var(--gold);letter-spacing:.04em;line-height:1.35}
#netInfo{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#feed{position:fixed;top:var(--gt);right:var(--gr);display:grid;gap:4px;justify-items:end;width:min(300px,40vw)}
#feed div{background:var(--panel);border:1px solid var(--line);padding:3px 10px;font-size:12px;border-radius:2px;animation:feedIn .25s ease-out}
#feed .t0{color:var(--blue)} #feed .t1{color:var(--red)} #feed .g{color:var(--gold)}
@keyframes feedIn{from{transform:translateX(20px);opacity:0}}
#banner{position:fixed;top:30%;left:0;right:0;text-align:center;pointer-events:none;font-family:var(--display);opacity:0;transition:opacity .3s;padding:0 var(--gr) 0 var(--gl)}
#banner.on{opacity:1}
#banner b{display:block;font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 24px rgba(255,198,109,.5)}
#banner small{display:block;font-family:var(--body);font-size:14px;color:var(--ink);letter-spacing:.1em;text-shadow:0 1px 4px #000}
.bottom{position:fixed;left:50%;bottom:var(--gb);transform:translateX(-50%);display:flex;gap:14px;align-items:flex-end}
.me{width:300px;display:grid;gap:5px;background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:3px}
.me .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.me .who b{font-family:var(--display);font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.me .who small{font-size:11px;color:var(--gold);letter-spacing:.08em;text-align:right}
.bar{position:relative;height:14px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .12s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.bar.hp #hpFill{background:linear-gradient(90deg,#1f8fd0,var(--blue))}
.bar.hp #shFill{background:rgba(240,248,255,.6)}
.bar.en{height:9px}.bar.en #enFill{background:linear-gradient(90deg,#b07dff,#e2b8ff)}
#slots{display:flex;gap:8px}
.slotwrap{position:relative}
.slot{position:relative;width:64px;height:64px;border:1px solid var(--line);background:rgba(10,14,28,.9);border-radius:3px;display:grid;place-items:center;padding:0;overflow:hidden}
.slot svg{width:30px;height:30px;color:var(--c,#fff)}
.slot .k{position:absolute;left:4px;top:2px;font-size:11px;font-weight:600;color:var(--ink)}
.slot .c{position:absolute;right:4px;bottom:2px;font-size:10px;color:#d9b8ff;font-variant-numeric:tabular-nums}
.slot .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:800;z-index:2;text-shadow:0 1px 3px #000}
.slot::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(2,4,10,.78) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
.slot.poor svg{opacity:.35}
.slot.ult{border-color:rgba(255,198,109,.35)}
.slot.ult.ready{border-color:var(--gold);box-shadow:0 0 14px rgba(255,198,109,.55),inset 0 0 10px rgba(255,198,109,.3)}
.tip{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);width:200px;background:var(--panel);border:1px solid var(--line);padding:7px 9px;font-size:12px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .15s;text-align:left}
.slotwrap:hover .tip{opacity:1}
.tip b{display:block;color:var(--gold);font-weight:600}
#dead{position:fixed;top:42%;left:0;right:0;text-align:center;font-family:var(--display);font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);text-shadow:0 0 18px rgba(255,63,142,.6);pointer-events:none}
#dead b{color:var(--ink)}
#pauseBtn{position:fixed;right:var(--gr);bottom:var(--gb);width:40px;height:40px;background:var(--panel);border:1px solid var(--line);border-radius:3px;font-weight:600}
#board{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;padding:0 var(--gr) 0 var(--gl)}
#board .inner{background:var(--panel);border:1px solid var(--line);padding:16px 20px;border-radius:3px;max-width:100%;overflow-x:auto}

table.st{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;min-width:440px}
table.st th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:right;padding:4px 10px;border-bottom:1px solid var(--line)}
table.st td{padding:5px 10px;text-align:right;border-bottom:1px solid rgba(130,160,255,.08)}
table.st th:first-child,table.st td:first-child,table.st th:nth-child(2),table.st td:nth-child(2){text-align:left}
table.st tr.t0 td:first-child{color:var(--blue)} table.st tr.t1 td:first-child{color:var(--red)}
table.st tr.mine td{background:rgba(255,198,109,.07)}
table.st td small{color:var(--muted)}

#touch{position:fixed;inset:0;pointer-events:none}
#stick{position:fixed;left:var(--gl);bottom:var(--gb);width:116px;height:116px;border-radius:50%;border:1px solid var(--line);background:rgba(10,14,28,.45);pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(106,203,255,.35);border:1px solid var(--cyan)}
#tAtk{position:fixed;right:var(--gr);bottom:calc(var(--gb) + 6px);width:86px;height:86px;border-radius:50%;background:rgba(255,179,71,.18);border:1px solid var(--amber);pointer-events:auto;font-family:var(--display);font-size:17px;letter-spacing:.1em;text-transform:uppercase;touch-action:none}
body.touch .bottom{display:contents}
body.touch .me{position:fixed;top:calc(var(--gt) + 56px);left:calc(var(--gl) + 120px);right:var(--gr);width:auto;max-width:260px;padding:5px 8px}
body.touch .me .who{display:none}
body.touch #slots{position:fixed;right:calc(var(--gr) + 96px);bottom:var(--gb);display:grid;grid-template-columns:repeat(2,52px);gap:6px}
body.touch .slot{width:52px;height:52px;touch-action:none}
body.touch .slot svg{width:24px;height:24px}
body.touch .tip{display:none}
body.touch #pauseBtn{bottom:auto;top:calc(var(--gt) + 4px)}
body.touch #feed{display:none}
body.touch #mini{width:92px;height:92px}
body.touch #hud .tl{width:110px}
body.touch #modeBar{top:calc(var(--gt) + 100px)}
@media (max-width:640px){
  #hud .top{gap:8px;padding:4px 10px}.score b{font-size:22px}.score>span{display:none}
  #mini{width:92px;height:92px} #hud .tl{width:110px} #relicInfo{font-size:11px}
  #feed{top:calc(var(--gt) + 52px)} #feed div:nth-child(n+3){display:none}
}

/* overlays */
.overlay{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;user-select:text}
.brand{font-size:12px;letter-spacing:.32em;color:var(--gold)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(48px,9vw,92px);line-height:.88;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h1 em{display:block;font-style:normal;font-weight:300;color:var(--gold);letter-spacing:.32em;font-size:.42em;margin-top:8px}
h2.sec{margin:0;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.lede{margin:0;max-width:60ch;color:#c4cce6;line-height:1.55;font-size:15px}
.lbl{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.help{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.help kbd{font-family:var(--body);font-size:11px;border:1px solid var(--line);border-radius:2px;padding:1px 5px;color:var(--ink)}
.go{background:var(--gold);color:#1a1206;border:0;padding:12px 22px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.12em;text-transform:uppercase;border-radius:3px;box-shadow:0 0 24px rgba(255,198,109,.3)}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go.alt{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.go.sm{padding:8px 14px;font-size:15px}
.ghost{background:transparent;border:1px solid var(--line);padding:9px 16px;border-radius:3px;font-size:14px}
.ghost:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.ghost.sm{padding:5px 10px;font-size:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 14px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,198,109,.14);color:var(--gold)}
.field{display:grid;gap:4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:15px;letter-spacing:.04em;text-transform:none;min-width:0}
.field input.code{text-transform:uppercase;letter-spacing:.3em;font-weight:600}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline .field{flex:1 1 120px}
.err{color:var(--red);font-size:13px;min-height:1em}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{display:grid;place-items:center;min-height:100%;padding:calc(var(--gt) + 10px) var(--gr) calc(var(--gb) + 10px) var(--gl);background:rgba(4,6,12,.8);box-sizing:border-box}
.card{display:grid;gap:16px;background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:3px;max-width:100%;min-width:0;box-sizing:border-box}
.card h2{margin:0;font-family:var(--display);font-size:52px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:.9}
.card h2.win{color:var(--gold)} .card h2.lose{color:var(--red)}
.card .tbl{overflow-x:auto}

/* auth */
#auth{background:linear-gradient(90deg,rgba(4,6,12,.96) 0%,rgba(4,6,12,.86) 46%,rgba(4,6,12,.2) 80%,rgba(4,6,12,.05) 100%)}
.awrap{max-width:560px;padding:calc(var(--gt) + 24px) var(--gr) calc(var(--gb) + 24px) var(--gl);display:grid;gap:22px}
@media (min-width:900px){.awrap{padding-left:max(64px,env(safe-area-inset-left,0px))}}
.authbox{display:grid;gap:12px;padding:18px;border:1px solid var(--line);background:rgba(10,14,28,.7);border-radius:3px}

/* hub */
#hub{background:linear-gradient(180deg,rgba(4,6,12,.92),rgba(4,6,12,.82) 60%,rgba(4,6,12,.7))}
.hubtop{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--gr) 10px var(--gl);background:rgba(6,9,18,.94);border-bottom:1px solid var(--line)}
.hubtop .who{display:flex;gap:14px;align-items:center;min-width:0}
.hubtop .lvl{font-family:var(--display);font-size:30px;font-weight:800;color:var(--gold);line-height:1}
.hubtop .nick{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.06em}
.xpbar{width:180px;height:6px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#b07dff,var(--gold))}
.cred{font-family:var(--display);font-size:20px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.cred small{font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:.1em}
.nav{display:flex;flex-wrap:wrap;gap:2px;padding:8px var(--gr) 0 var(--gl);border-bottom:1px solid var(--line);background:rgba(6,9,18,.7)}
.nav button{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:14px;letter-spacing:.06em;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold)}
.hubbody{padding:20px var(--gr) calc(var(--gb) + 30px) var(--gl);display:grid;gap:22px;max-width:1180px;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
.panel{display:grid;gap:12px;align-content:start;padding:16px;border:1px solid var(--line);background:var(--panel2);border-radius:3px;min-width:0}
.panel h3{margin:0;font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.classes{grid-template-columns:1fr}}
.cc{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);background:rgba(10,14,28,.7);border-radius:3px;transition:border-color .15s,background .15s}
.cc svg{width:38px;height:38px;color:var(--c);grid-row:span 2}
.cc b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.cc small{color:var(--muted);font-size:12px}
.cc[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,rgba(10,14,28,.85))}
.cc:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.modes{grid-template-columns:1fr}}
.mc{display:grid;gap:6px;text-align:left;padding:14px;border:1px solid var(--line);background:rgba(10,14,28,.7);border-radius:3px;align-content:start}
.mc b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.mc small{color:var(--muted);font-size:12px;line-height:1.4}
.mc .tag{font-size:10px;letter-spacing:.2em;color:var(--gold)}
.mc[aria-pressed="true"]{border-color:var(--gold);background:rgba(255,198,109,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(10,14,28,.7);border:1px solid var(--line);border-radius:3px;padding:7px 12px;font-size:13px;text-align:left}
.chip small{display:block;color:var(--muted);font-size:11px}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px;padding:16px;border:1px solid var(--line);background:rgba(10,14,28,.6);border-radius:3px}
@media (max-width:620px){.detail{grid-template-columns:1fr}}
.stats{display:grid;gap:8px;align-content:start}
.stat{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.stat i{height:5px;background:rgba(255,255,255,.08);position:relative;border-radius:1px}
.stat i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--v);background:var(--c)}
.talent{font-size:12px;line-height:1.45;color:#c4cce6;margin:0}
.talent b{color:var(--c)}
.skl{display:grid;gap:9px}
.sk{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.sk kbd{font-family:var(--body);font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:2px;text-align:center;padding:3px 0;background:rgba(255,255,255,.04)}
.sk kbd.u{border-color:var(--gold);color:var(--gold)}
.sk kbd svg{width:16px;height:16px;display:block;margin:auto}
.sk div{font-size:12.5px;line-height:1.4;color:#c4cce6}
.sk div b{color:var(--ink);font-weight:600;margin-right:6px}
.sk div small{color:#d9b8ff}
.mods{display:flex;flex-wrap:wrap;gap:6px}
.mods span{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:2px;color:#c4cce6}
#preview{width:100%;aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);border-radius:3px;background:radial-gradient(circle at 50% 60%,rgba(255,198,109,.08),transparent 70%)}
/* items */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{position:relative;display:grid;gap:3px;text-align:left;padding:10px 10px 10px 12px;border:1px solid var(--line);border-left:3px solid var(--rc);background:rgba(10,14,28,.75);border-radius:3px;min-width:0}
.item b{font-size:13px;font-weight:600;color:var(--rc);line-height:1.25}
.item small{font-size:11px;color:var(--muted)}
.item .eqd{position:absolute;right:6px;top:6px;font-size:9px;letter-spacing:.14em;color:var(--gold)}
.item[aria-pressed="true"]{outline:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 10%,rgba(10,14,28,.85))}
.item.empty{border-left-color:var(--line);color:var(--muted)}
.idet{display:grid;gap:8px}
.idet h4{margin:0;font-size:18px;color:var(--rc);font-weight:600}
.idet ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13px;color:#c4cce6}
.idet .uq{font-size:13px;color:var(--gold);line-height:1.4}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}
/* tree */
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tree{grid-template-columns:1fr}}
.branch{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:3px;background:rgba(10,14,28,.6)}
.branch h4{margin:0;font-family:var(--display);font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.branch>small{color:var(--muted);font-size:12px}
.node{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:rgba(0,0,0,.25)}
.node b{font-size:13px;font-weight:600}
.node small{grid-column:1/-1;font-size:11.5px;color:var(--muted);line-height:1.35}
.node .rk{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.node.on{border-color:var(--c)} .node.on .rk{color:var(--c)}
.node.cap{border-style:dashed}
.node.locked{opacity:.45}
.node .tier{font-size:10px;letter-spacing:.14em;color:var(--muted)}
/* market & shop */
.list{display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--rc);border-radius:3px;background:rgba(10,14,28,.7)}
.lrow b{color:var(--rc);font-size:13px;font-weight:600}
.lrow small{display:block;color:var(--muted);font-size:11px}
.price{font-family:var(--display);font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.skin{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:3px;background:rgba(10,14,28,.7)}
.skin .sw{height:34px;border-radius:2px;background:linear-gradient(135deg,var(--a) 0 55%,var(--g) 55% 62%,var(--a) 62%)}
.skin b{font-size:13px}.skin small{font-size:11px;color:var(--muted)}
.skin.cur{border-color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(var(--gb) + 10px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--ink);padding:10px 16px;border-radius:3px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
#toast.bad{border-color:var(--red)}
/* lobby */
.lobby{width:min(760px,100%)}
.code-big{font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:.3em;color:var(--gold);line-height:1}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.teams.one{grid-template-columns:1fr}
@media (max-width:560px){.teams{grid-template-columns:1fr}}
.team{border:1px solid var(--line);border-radius:3px;padding:12px;display:grid;gap:6px;align-content:start}
.team h3{margin:0 0 4px;font-family:var(--display);font-size:20px;letter-spacing:.14em;text-transform:uppercase}
.team.t0 h3{color:var(--blue)} .team.t1 h3{color:var(--red)}
.pl{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 8px;background:rgba(255,255,255,.03);border-radius:2px}
.pl small{color:var(--muted)}
.pl.mine{outline:1px solid var(--gold)}
.pl.bot{color:var(--muted);font-style:italic}
.minicls{display:flex;gap:6px;flex-wrap:wrap}
.minicls button{display:flex;gap:6px;align-items:center;background:rgba(10,14,28,.7);border:1px solid var(--line);border-radius:3px;padding:6px 10px;font-size:13px}
.minicls button svg{width:18px;height:18px;color:var(--c)}
.minicls button[aria-pressed="true"]{border-color:var(--c);color:var(--c)}
/* rewards */
.rew{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:3px;background:rgba(10,14,28,.6)}
.rew .big{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--display);font-size:24px;font-weight:800}
.rew .big span{color:var(--gold)}
.deb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:10px 0}
.deb>div{padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:rgba(10,14,28,.6);display:grid;gap:7px;align-content:start}
.deb h4{margin:0;font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.deb .mvp{font-family:var(--display);font-size:20px;font-weight:800;color:var(--gold)}
.cb{display:grid;grid-template-columns:120px 1fr 48px;gap:8px;align-items:center;font-size:13px}
.cb i{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--gold) var(--w),rgba(130,160,255,.15) var(--w))}
.cb b{text-align:right}
.tl{display:grid;gap:3px;font-size:13px;max-height:190px;overflow-y:auto}
.tl div{display:grid;grid-template-columns:42px 1fr;gap:6px}.tl small{color:var(--muted)}.tl .t0{color:var(--blue)}.tl .t1{color:var(--red)}
@media (max-width:640px){.deb{grid-template-columns:1fr}.cb{grid-template-columns:96px 1fr 42px}}
.rank{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rank b{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:.04em;display:block}
.rkb{display:inline-grid;place-items:center;min-width:96px;padding:10px 14px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);
  font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.12em;text-transform:uppercase;border-radius:3px;box-shadow:0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.rkb.sm{min-width:0;padding:2px 8px;font-size:11px;box-shadow:none}
.divs{display:flex;flex-wrap:wrap;gap:6px}
.divs span{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.divs span.on{border-color:var(--c);color:var(--c)}
.rkd{font-family:var(--display);font-size:22px;font-weight:800}
.rew .lvup{font-family:var(--display);font-size:22px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bars"></div>
<div id="floaters"></div>
<div id="flash"></div>

<div id="hud" hidden>
  <div class="top score">
    <span class="t0" id="sL">Modří</span><b class="t0" id="s0">0</b>
    <div class="mid"><span id="clock">6:00</span><small id="scoreSub">do 20</small></div>
    <b class="t1" id="s1">0</b><span class="t1" id="sR">Rudí</span>
  </div>
  <div id="modeBar"></div>
  <div class="tl"><canvas id="mini" width="300" height="300"></canvas><div id="relicInfo"></div><div id="netInfo"></div></div>
  <div id="feed"></div>
  <div id="banner"><b></b><small></small></div>
  <div class="bottom">
    <div class="me">
      <div class="who"><b id="meName"></b><small id="meStatus"></small></div>
      <div class="bar hp"><i id="hpFill"></i><i id="shFill"></i><span id="hpText"></span></div>
      <div class="bar en"><i id="enFill"></i><span id="enText"></span></div>
    </div>
    <div id="slots"></div>
  </div>
  <div id="dead" hidden>Zničen · obnova za <b id="deadT">5</b> s</div>
  <div id="touch" hidden><div id="stick"><i></i></div><button id="tAtk" type="button">Útok</button></div>
  <button id="pauseBtn" type="button" aria-label="Menu zápasu">II</button>
</div>
<div id="board" hidden><div class="inner"></div></div>

<div id="auth" class="overlay" hidden>
  <div class="awrap">
    <div class="brand">◇ RELIKVIE · ARÉNA</div>
    <h1>Relikvie<em>Aréna signálu</em></h1>
    <p class="lede">Arény 3 proti 3, kooperace proti bossům a vlnám dronů. Sbírej implantáty, rozvíjej strom dovedností a obchoduj s ostatními na tržišti.</p>
    <div id="authBody"></div>
  </div>
</div>

<div id="hub" class="overlay" hidden>
  <div class="hubtop" id="hubTop"></div>
  <nav class="nav" id="hubNav" aria-label="Sekce"></nav>
  <div class="hubbody" id="hubBody"></div>
</div>

<div id="lobby" class="overlay" hidden>
  <div class="center"><div class="card lobby">
    <div class="brand">ONLINE MÍSTNOST</div>
    <div class="btns" style="justify-content:space-between">
      <div class="code-big" id="lobbyCode">----</div>
      <button class="ghost" id="copyBtn" type="button">Kopírovat pozvánku</button>
    </div>
    <div id="lobbyCfg"></div>
    <div class="teams" id="lobbyTeams"></div>
    <div><div class="lbl">Tvoje povolání</div><div class="minicls" id="lobbyCls"></div></div>
    <div class="btns">
      <button class="go" id="lobbyStart" type="button">Spustit zápas</button>
      <span class="help" id="lobbyWait"></span>
      <button class="ghost" id="lobbyLeave" type="button">Opustit</button>
    </div>
    <div class="err" id="lobbyErr" role="status"></div>
  </div></div>
</div>

<div id="pause" class="overlay" hidden>
  <div class="center"><div class="card">
    <h2 id="pauseTitle">Pauza</h2>
    <p class="help" id="pauseNote"></p>
    <div class="btns"><button class="go" id="resumeBtn" type="button">Pokračovat</button><button class="ghost" id="quitBtn" type="button">Opustit zápas</button></div>
  </div></div>
</div>

<div id="end" class="overlay" hidden>
  <div class="center"><div class="card">
    <div class="brand" id="endSub"></div>
    <h2 id="endTitle"></h2>
    <div id="endRewards"></div>
    <div id="endDebrief"></div>
    <div class="tbl" id="endTable"></div>
    <p class="help" id="endNote"></p>
    <div class="btns"><button class="go" id="againBtn" type="button">Hrát znovu</button><button class="ghost" id="menuBtn" type="button">Zpět do hubu</button></div>
  </div></div>
</div>
<div id="toast" role="status" hidden></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module" src="client.js"></script>
</body>
</html>
